[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplifyr-event-model"
version = "0.1.0"
description = "Simplifyr common event envelope and lifecycle primitives"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]