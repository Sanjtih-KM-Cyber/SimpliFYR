# Simplifyr — development/production compose stack.
# Postgres-first: the api service runs against PostgreSQL here (SQLite stays
# the zero-setup dev default outside compose). pg_trgm is enabled by migration
# for trigram-ranked full-text search. Prove it any time with:
#   docker compose up -d postgres
#   TEST_POSTGRES_URL=postgresql+psycopg2://simplifyr:simplifyr@127.0.0.1:5432/simplifyr \
#     pytest tests/test_postgres_search.py -q
# The app runs standalone without Docker (SQLite + in-process workers); this compose
# provides the scale- and integration-oriented deployment (Postgres, Redis, MinIO,
# Kafka, and an optional local AI runtime).
#
#   docker compose up --build
#
# Backends stay on their safe defaults (in-memory pipeline, filesystem raw store);
# switch them via the commented environment variables below. Switching
# PIPELINE_BACKEND to kafka requires kafka-python (see backend/requirements-scale.txt,
# baked into the image).

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://simplifyr:simplifyr@postgres:5432/simplifyr
      RAW_STORAGE_DIR: /data/raw
      # Production posture in compose: auth on, ingest rate-limited, proxy
      # headers trusted (only the bundled nginx sits in front of the API).
      # Demo tokens — rotate immediately via POST /api/v1/system/rotate-keys.
      AUTH_ENABLED: "true"
      API_KEYS: '{"admin":"simplifyr-admin-demo","operator":"simplifyr-operator-demo","analyst":"simplifyr-analyst-demo"}'
      RATE_LIMIT_PER_MINUTE: "600"
      TRUST_PROXY_HEADERS: "true"
      AI_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      PIPELINE_WORKERS: "2"
      PIPELINE_MAX_QUEUE: "10000"
      # PIPELINE_BACKEND: kafka  # durable transport via the kafka service below
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # CACHE_BACKEND: redis  # distributed rate limiting + mapping cache
      REDIS_URL: redis://redis:6379
      # RAW_STORE_BACKEND: s3  # MinIO-backed raw storage
      S3_BUCKET: simplifyr
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: simplifyr
      S3_SECRET_KEY: simplifyr-secret
      SYSLOG_UDP_HOST: 0.0.0.0
      SYSLOG_UDP_PORT: "5514"
      SYSLOG_TCP_ENABLED: "false"
      SYSLOG_TCP_HOST: 0.0.0.0
      SYSLOG_TCP_PORT: "5515"
      FILE_WATCH_ENABLED: "false"
      KAFKA_INGRESS_ENABLED: "false"
    ports:
      - "8000:8000"
      - "5514:5514/udp"
      - "5515:5515"
    volumes:
      - rawdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simplifyr
      POSTGRES_PASSWORD: simplifyr
      POSTGRES_DB: simplifyr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplifyr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: simplifyr
      MINIO_ROOT_PASSWORD: simplifyr-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNDVfNTQ0MzkwNw
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  rawdata:
  miniodata:
  ollamadata:
